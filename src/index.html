<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div id="login-screen" class="screen">
        <h1>Welcome</h1>
        <input id="username" type="text" placeholder="Enter your name" autofocus>
        <button id="login-btn">Start Chatting</button>
    </div>

    <div id="chat-screen" class="screen hidden">
        <header>
            <span id="chat-with">Chat</span>
            <button id="dark-toggle" aria-label="Toggle dark mode">🌙</button>
        </header>
        <main id="messages"></main>
        <div id="typing" class="typing hidden">User is typing...</div>
        <footer>
            <button id="emoji-btn" aria-label="Insert emoji">😊</button>
            <input id="message-input" type="text" placeholder="Type a message">
            <button id="send-btn" aria-label="Send">➤</button>
        </footer>
        <div id="emoji-panel" class="hidden"></div>
    </div>

<script src="scripts/app.js"></script>
</body>
</html>
